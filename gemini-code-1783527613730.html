    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(16, 22, 37, 0.6);
            --cyan-glow: #00e5ff;
            --cyan-dim: #00a8cc;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(123, 31, 162, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: var(--cyan-glow);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .brand-badge span {
            width: 8px;
            height: 8px;
            background-color: var(--cyan-glow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cyan-glow);
            display: inline-block;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.notice {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .highlight {
            color: var(--cyan-glow);
            font-weight: 600;
        }

        .links-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .btn-inner {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-inner i {
            font-size: 1.3rem;
        }

        .btn-telegram {
            background: #229ED9;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.2);
        }

        .btn-telegram:hover {
            background: #24a7e3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 158, 217, 0.4);
        }

        .btn-youtube {
            background: #FF0000;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
        }

        .btn-youtube:hover {
            background: #ff1a1a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.4);
        }

        .arrow-icon {
            font-size: 0.9rem;
            opacity: 0.7;
            transition: transform 0.3s ease;
        }

        .btn:hover .arrow-icon {
            transform: translateX(4px);
            opacity: 1;
        }

        .footer-note {
            font-size: 0.85rem;
            color: rgba(148, 163, 184, 0.5);
            margin-top: 20px;
        }

        /* Responsive Settings */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            p.notice {
                font-size: 1rem;
            }
            .btn {
                padding: 14px 20px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

</html>
